<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDC Store | Flashlight Custom</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__content">
        <p class="badge">Built for enthusiasts</p>
        <h1>Custom Flashlight & EDC Gear</h1>
        <p>
          Cửa hàng mini bán đèn pin custom và đồ EDC, tích hợp checkout LemonSqueezy
          chuẩn để dev mở rộng.
        </p>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <label for="email">Email nhận hóa đơn (tuỳ chọn)</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </section>

      <section id="products" class="grid"></section>
      <p id="status" class="status"></p>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
